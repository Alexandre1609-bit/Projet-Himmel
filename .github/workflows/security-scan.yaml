---
name: Himmel-security-CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Audit & quality check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: install yamllint
        run: pip install yamllint

      - name: check lint with yamllint
        run: yamllint .

      - name: Trivy Security Audit - IaC & Secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'misconfig,secret'
          format: table
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy Security Audit - Vulnerabilities (CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln' #filet de sécurité supplémentaire pour applicatif (et donc des fichiers de dépendances) quand ça arrivera dans le repo.
          format: table
          ignore-unfixed: true
          skip-setup-trivy: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy Security Audit - Container images
        run: |
          images=$(grep -rhoE '^\s*image:\s*\S+' k8s/manifests | awk '{print $2}' | tr -d '"' | sort -u)
          echo "Images found:"
          echo "$images"
          fail=0
          for img in $images; do
            echo "::group::$img"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1

    if: |
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'docs') &&
      !contains(github.event.pull_request.labels.*.name, 'typo') &&
      !contains(github.event.pull_request.labels.*.name, 'documentation')

    steps:

      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep scan
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
