---
- name: "Global Deployment: Kubernetes Cluster"
  hosts: all
  become: true

  roles:
    - role: os_hardening
    - role: containerd
    - role: kubernetes

- name: "Install etcd binaries and copy etcd-snapshot script, service and timer on masters"
  hosts: [masters]
  become: true
  roles:
    - role: etcd_install
    - role: etcd_backup
