---
- name: "System Hardening : Full System Update"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    autoremove: true

- name: "Install base dependencies"
  ansible.builtin.apt:
    name:
      - iproute2
      - ca-certificates
      - gnupg2
      - conntrack
    state: present

- name: "Disable SWAP (1/2) - Turn off swap immediately"
  ansible.builtin.command: swapoff -a
  when: ansible_facts["swaptotal_mb"] > 0
  changed_when: ansible_facts["swaptotal_mb"] > 0

- name: "Disable SWAP (2/2) - Remove swap entry from /etc/fstab"
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
    backup: true

- name: "Disable UFW (Firewall) to ensure Kubernetes traffic flow"
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: false
