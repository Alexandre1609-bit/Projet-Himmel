apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default
  
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-grafana
      namespace: prometheus
      jsonPointers:
        - /data/admin-password
        - /data/admin-user
        - /data/ldap-toml
    - group: "apps"
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1config
        - /spec/template/metadata/annotations/checksum~1sc-dashboard-provider-config

  sources:
    - repoURL: "https://prometheus-community.github.io/helm-charts"
      chart: kube-prometheus-stack
      targetRevision: "83.6.0"
      helm:
        valueFiles:
          - $values/k8s/apps/helm-values/prometheus-values.yaml

    - repoURL: "https://github.com/Alexandre1609-bit/Projet-Himmel.git"
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true