apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://falcosecurity.github.io/charts"
    chart: falco
    targetRevision: "8.0.2"
    helm:
      values: |
        metrics:
          enabled: true
          interval: 15s
        webserver:
          enabled: true
          prometheus_metrics_enabled: true
          listen_port: 8765
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
