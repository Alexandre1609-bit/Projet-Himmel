alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-whook

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: email-notification
      routes:
        - matchers:
            - severity="critical"
          receiver: slack

    receivers:
      - name: "null"

      - name: "email-notification"
        email_configs:
          - to: alexandre-alertmanager@hotmail.fr

      - name: "slack"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-whook/api_url
            channel: "#alerts"
            send_resolved: true