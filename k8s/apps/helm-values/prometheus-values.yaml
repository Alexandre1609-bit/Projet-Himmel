alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-whook

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: email-notification
      group_by: ['alertname']
      
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers:
            - severity="critical"
          group_wait: 10s
          receiver: slack

    

    receivers:
      - name: "null"

      - name: "email-notification"
        email_configs:
          - to: alexandre-alertmanager@hotmail.fr

      - name: "slack"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-whook/api_url
            channel: "#alerts"
            send_resolved: true