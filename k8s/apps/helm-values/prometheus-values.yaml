alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-whook

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack
      group_by: ['alertname']
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 4h

    receivers:
      - name: "null"

      - name: "slack"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-whook/api_url
            channel: "#alerts"
            send_resolved: true