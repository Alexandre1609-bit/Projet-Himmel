apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Alexandre1609-bit/Projet-Himmel"
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true