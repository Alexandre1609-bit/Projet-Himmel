---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 17.3.1
      helm:
        valueFiles:
          - $values/k8s/apps/helm-values/loki-values.yaml

    - repoURL: "https://github.com/Alexandre1609-bit/Projet-Himmel.git"
      targetRevision: HEAD
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
