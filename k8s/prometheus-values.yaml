alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: email-notification
      routes:
        - match:
            severity: critical
            receiver: slack

    receivers:
      - name: "null"

      - name: "email-notification"
        email_configs:
          - to: alexandre-alertmanager@hotmail.fr

      - name: "slack"
        slack_configs:
          - api_url: #
            channel: "#alerts"
            send_resolved: true