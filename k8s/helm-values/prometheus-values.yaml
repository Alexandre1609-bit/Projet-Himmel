helm:
    values: |
      alertmanager:
        global:
          resolve_timeout: 5m
        config:
          receivers:
            - name: "null"
            - name: "email-notification""
              email-configs:
                - to: "#adresse email à mettre, se renseigner pour éviter d'hardcoder"
          route:
            receiver: "default"
            group_by: [ 'alertname' ]
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 1h
            receiver: "email-notification"