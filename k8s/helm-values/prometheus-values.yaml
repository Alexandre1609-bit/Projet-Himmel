helm:
  values: |
    alertmanager:
      config:
        global:
          resolve_timeout: 5m

        route:
          receiver: email-notification

        receivers:
          - name: "null"

          - name: "email-notification"
            email_configs:
              - to: alexandre.alertmanager@hotmail.fr

          - name: "slack"
            slack_configs:
              - api_url: #à ajouter plus tard /!\ bitnami sealed secret !
                channel: "#alerts"
                send_resolved: true