---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-pods-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchConditions:
    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c,
                Object.spec.containers{
                  name: c.name,
                  securityContext: Object.spec.containers.securityContext{
                      privileged: false,
                      allowPrivilegeEscalation: false
                      }
                    }
                  )
                }
              }

---

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-pods-init-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchConditions:
    - name: check-if-init-containers-exist
      expression: "has(object.spec.initContainers)"

    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              initContainers: object.spec.initContainers.map(c,
                Object.spec.initContainers{
                  name: c.name,
                  securityContext: Object.spec.initContainers.securityContext{
                      privileged: false,
                      allowPrivilegeEscalation: false
                      }
                    }
                  )
                }
              }
