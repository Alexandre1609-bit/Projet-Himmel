---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-cronjobs-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs"]

  matchConditions:
    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              jobTemplate: Object.spec.jobTemplate{
                spec: Object.spec.jobTemplate.spec{
                  template: Object.spec.jobTemplate.spec.template{
                    spec: Object.spec.jobTemplate.spec.template.spec{
                      containers: object.spec.jobTemplate.spec.template.spec.containers.map(c,
                        Object.spec.jobTemplate.spec.template.spec.containers{
                          name: c.name,
                          securityContext: Object.spec.jobTemplate.spec.template.spec.containers.securityContext{
                            privileged: false,
                            allowPrivilegeEscalation: false
                          }
                        }
                      )
                    }
                  }
                }
              }
            }
          }

---

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-cronjobs-init-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs"]

  matchConditions:
    - name: check-if-init-containers-exist
      expression: "has(object.spec.jobTemplate.spec.template.spec.initContainers)"

    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              jobTemplate: Object.spec.jobTemplate{
                spec: Object.spec.jobTemplate.spec{
                  template: Object.spec.jobTemplate.spec.template{
                    spec: Object.spec.jobTemplate.spec.template.spec{
                      initContainers: object.spec.jobTemplate.spec.template.spec.initContainers.map(c,
                        Object.spec.jobTemplate.spec.template.spec.initContainers{
                          name: c.name,
                          securityContext: Object.spec.jobTemplate.spec.template.spec.initContainers.securityContext{
                            privileged: false,
                            allowPrivilegeEscalation: false
                          }
                        }
                      )
                    }
                  }
                }
              }
            }
          }
