---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-privilege-escalation
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: tier
          operator: NotIn
          values: ["infra"]

    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]

      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]

  validations:
    - message: "Privilege escalation is forbidden in containers (Workload). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind in ['Deployment', 'DaemonSet', 'StatefulSet', 'Job'] ?
        object.spec.template.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false) : true

    - message: "Privilege escalation is forbidden in initContainers (Workload). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind in ['Deployment', 'DaemonSet', 'StatefulSet', 'Job'] ?
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)) : true

    - message: "Privilege escalation is forbidden in containers (Pod). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind == 'Pod' ?
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false) : true

    - message: "Privilege escalation is forbidden in initContainers (Pod). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind == 'Pod' ?
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)) : true

    - message: "Privilege escalation is forbidden in containers (CronJob). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind == 'CronJob' ?
        object.spec.jobTemplate.spec.template.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false) : true

    - message: "Privilege escalation is forbidden in initContainers (CronJob). Please set allowPrivilegeEscalation to false."
      expression: >
        request.kind.kind == 'CronJob' ?
        (!has(object.spec.jobTemplate.spec.template.spec.initContainers) || object.spec.jobTemplate.spec.template.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)) : true
