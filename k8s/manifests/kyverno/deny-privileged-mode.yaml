---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-privileged-mode
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]

      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]

  matchConditions:
    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  validations:
    - message: "Privileged mode is forbidden in containers (Workload). Please set privileged to false."
      expression: >
        request.kind.kind in ['Deployment', 'DaemonSet', 'StatefulSet', 'Job'] ?
        object.spec.template.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false) : true

    - message: "Privileged mode is forbidden in initContainers (Workload). Please set privileged to false."
      expression: >
        request.kind.kind in ['Deployment', 'DaemonSet', 'StatefulSet', 'Job'] ?
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false)) : true

    - message: "Privileged mode is forbidden in containers (Pod). Please set privileged to false."
      expression: >
        request.kind.kind == 'Pod' ?
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false) : true

    - message: "Privileged mode is forbidden in initContainers (Pod). Please set privileged to false."
      expression: >
        request.kind.kind == 'Pod' ?
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false)) : true

    - message: "Privileged mode is forbidden in containers (CronJob). Please set privileged to false."
      expression: >
        request.kind.kind == 'CronJob' ?
        object.spec.jobTemplate.spec.template.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false) : true

    - message: "Privileged mode is forbidden in initContainers (CronJob). Please set privileged to false."
      expression: >
        request.kind.kind == 'CronJob' ?
        (!has(object.spec.jobTemplate.spec.template.spec.initContainers) || object.spec.jobTemplate.spec.template.spec.initContainers.all(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == false)) : true
