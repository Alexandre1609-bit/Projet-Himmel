---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels-on-resources
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: tier
          operator: NotIn
          values: ["infra"]

    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]

      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]

  validations:
    - message: "Please add the labels 'app.kubernetes.io/name' and 'env' (value: prod or test) to the resource."
      expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels && 'env' in object.metadata.labels && object.metadata.labels['env'] in ['prod', 'test']"
