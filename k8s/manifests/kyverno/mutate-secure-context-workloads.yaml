---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-workloads-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]

  matchConditions:
    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                spec: Object.spec.template.spec{
                  containers: object.spec.template.spec.containers.map(c,
                    Object.spec.template.spec.containers{
                      name: c.name,
                      securityContext: Object.spec.template.spec.containers.securityContext{
                        privileged: false,
                        allowPrivilegeEscalation: false
                      }
                    }
                  )
                }
              }
            }
          }

---

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-secure-context-workloads-init-containers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]

  matchConditions:
    - name: check-if-init-containers-exist
      expression: "has(object.spec.template.spec.initContainers)"

    - name: exclude-system-namespaces
      expression: >
        !(object.metadata.namespace in [
          'argocd', 'cilium-secrets', 'falco', 'grafana',
          'kube-node-lease', 'kube-public', 'kube-system',
          'kyverno', 'monitoring', 'prometheus', 'loki', 'alloy'
        ])
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                spec: Object.spec.template.spec{
                  initContainers: object.spec.template.spec.initContainers.map(c,
                    Object.spec.template.spec.initContainers{
                      name: c.name,
                      securityContext: Object.spec.template.spec.initContainers.securityContext{
                        privileged: false,
                        allowPrivilegeEscalation: false
                      }
                    }
                  )
                }
              }
            }
          }
