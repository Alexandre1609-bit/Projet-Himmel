---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx
  labels:
    app: nginx
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        env: prod
    spec:
      nodeName: node3
      containers:
        - name: nginx
          image: nginx:1.14.2
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: "/var/www/html"
              name: mypd
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      volumes:
        - name: mypd
          persistentVolumeClaim:
            claimName: myclaim

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv0003
  labels:
    env: prod
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/data/nginx
  claimRef:
    name: myclaim
    namespace: nginx
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myclaim
  namespace: nginx
  labels:
    env: prod
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
  selector:
    matchLabels:
      env: "prod"

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: nginx
  labels:
    env: prod
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http-nginx
      protocol: TCP
      port: 80
      targetPort: 80
