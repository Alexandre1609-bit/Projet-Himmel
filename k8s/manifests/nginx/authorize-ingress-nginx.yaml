---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "authorize-ingress-only"
spec:
  endpointSelector:
    matchLabels:
      app: nginx
  ingress:
    - fromEntities:
        - ingress
  egress:
    - toPorts:
        - ports:
            - port: "8080"
              protocol: "TCP"
