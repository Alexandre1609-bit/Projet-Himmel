---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-app-nginx
  namespace: nginx
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - "projet-himmel.duckdns.org"
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-service
          port: 80
