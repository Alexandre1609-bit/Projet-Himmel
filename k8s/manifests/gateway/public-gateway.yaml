---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  gatewayClassName: cilium
  listeners:
    - name: HTTPS
      protocol: HTTPS
      port: 443
      hostname: "projet-himmel.duckdns.org"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: himmel-tls-secret
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              tier: app
