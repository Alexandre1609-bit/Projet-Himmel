---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTPS
      port: 443
      name: web-gw
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              tier: app
