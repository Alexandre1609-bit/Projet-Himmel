---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test-deploy
  namespace: test-ns
  labels:
    app: nginx-test
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
        env: prod
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx/nginx-unprivileged:1.30.6-alpine-slim
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: mypd
              mountPath: "/var/www/html"
            - name: tmp
              mountPath: "/tmp"
            - name: cache
              mountPath: "/var/cache/nginx"
      volumes:
        - name: mypd
          persistentVolumeClaim:
            claimName: myclaim
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv0005
  labels:
    env: prod
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/data/nginx-test
  claimRef:
    name: myclaim
    namespace: test-ns
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myclaim
  namespace: test-ns
  labels:
    env: prod
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
  selector:
    matchLabels:
      env: "prod"

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: test-ns
spec:
  selector:
    app: nginx-test
  ports:
    - name: http-nginx-test
      protocol: TCP
      port: 80
      targetPort: 8080
