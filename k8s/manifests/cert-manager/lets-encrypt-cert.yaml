apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: projet-himmel-tls
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: himmel-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - projet-himmel.duckdns.org
