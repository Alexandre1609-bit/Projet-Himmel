---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: himmel-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  commonName: "himmel-internal-ca"
  secretName: internal-ca-secret

  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
