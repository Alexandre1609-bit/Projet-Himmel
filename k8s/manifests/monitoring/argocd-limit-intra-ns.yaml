---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "limit-traffic-argocd"
  namespace: argocd
spec:
  endpointSelector: {}

  ingress:
    - fromEntities:
        - host
        - remote-node

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
    - toEntities:
        - remote-node

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "argocd-egress-world"
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: repo-server
  egress:
    - toEntities:
        - world
