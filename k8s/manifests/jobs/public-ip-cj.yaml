---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: duckdns-updater
  namespace: network
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
          containers:
            - name: duckdns-curl
              image: curlimages/curl:8.21.0
              env:
                - name: DUCKDNS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dns-key
                      key: token
              command:
                - /bin/sh
                - -c
                - 'curl -s -m 10 "https://www.duckdns.org/update?domains=projet-himmel&token=${DUCKDNS_TOKEN}&ip="'
              securityContext:
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                allowPrivilegeEscalation: false
                privileged: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          restartPolicy: OnFailure
