---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

      - id: check-yaml
        args: [--allow-multiple-documents]

      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform scan
        language: system
        entry: kubeconform -ignore-filename-pattern 'k8s/apps/helm-values/' -strict -kubernetes-version 1.31.0 -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' ./k8s/
        files: ^k8s/
        pass_filenames: false


  # - repo: https://github.com/markdownlint/markdownlint (future implementation)
